name: macro_pro_camera
description: Aplikasi kamera makro profesional berbasis Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  path_provider: ^2.1.2
  permission_handler: ^11.3.1
  local_auth: ^2.1.8
  image: ^4.2.0
  ffmpeg_kit_flutter_full_gpl: ^6.0.3
  google_mlkit_object_detection: ^0.12.0
  google_mlkit_subject_segmentation: ^0.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
